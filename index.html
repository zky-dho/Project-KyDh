<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catatan Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #form {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    #noteInput {
      width: 70%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      margin-left: 10px;
      font-size: 16px;
      border: none;
      background-color: #5cb85c;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #4cae4c;
    }
    #notesContainer {
      max-width: 600px;
      margin: 0 auto;
    }
    .note {
      background-color: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .deleteBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      color: #c00;
      font-size: 20px;
      cursor: pointer;
    }
    .deleteBtn:hover {
      color: #900;
    }
  </style>
</head>
<body>

<h1>Catatan Saya</h1>

<div id="form">
  <input type="text" id="noteInput" placeholder="Tulis catatan..."/>
  <button onclick="addNote()">Tambah</button>
</div>

<div id="notesContainer"></div>

<script>
  // Mengecek dan memuat catatan dari local storage saat halaman dimuat
  window.onload = function() {
    loadNotes();
  }

  function addNote() {
    const input = document.getElementById('noteInput');
    const noteText = input.value.trim();
    if (noteText === "") {
      alert("Isi catatan tidak boleh kosong!");
      return;
    }
    const noteObj = {
      id: Date.now(),
      text: noteText
    };
    saveNoteToStorage(noteObj);
    displayNote(noteObj);
    input.value = "";
  }

  function saveNoteToStorage(note) {
    let notes = JSON.parse(localStorage.getItem('notes')) || [];
    notes.push(note);
    localStorage.setItem('notes', JSON.stringify(notes));
  }

  function loadNotes() {
    let notes = JSON.parse(localStorage.getItem('notes')) || [];
    notes.forEach(note => {
      displayNote(note);
    });
  }

  function displayNote(note) {
    const container = document.getElementById('notesContainer');
    const noteDiv = document.createElement('div');
    noteDiv.className = 'note';
    noteDiv.setAttribute('data-id', note.id);

    const noteText = document.createElement('p');
    noteText.innerText = note.text;

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'deleteBtn';
    deleteBtn.innerHTML = '&times;';
    deleteBtn.onclick = function() {
      deleteNote(note.id);
    }

    noteDiv.appendChild(noteText);
    noteDiv.appendChild(deleteBtn);
    container.appendChild(noteDiv);
  }

  function deleteNote(id) {
    let notes = JSON.parse(localStorage.getItem('notes')) || [];
    notes = notes.filter(note => note.id !== id);
    localStorage.setItem('notes', JSON.stringify(notes));
    // Hapus dari tampilan
    const noteDiv = document.querySelector(`.note[data-id='${id}']`);
    if (noteDiv) {
      noteDiv.remove();
    }
  }
</script>

</body>
</html>
